<html lang="ar" dir="rtl">

<title>ORVEX</title>
<meta name="description" content="ORVEX نظام مبيعات ونقاط بيع ومخزون">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="ORVEX">
<meta property="og:site_name" content="ORVEX">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
(function(){
  try {
    var saved=localStorage.getItem('orvex-theme');
    if(saved==='light'||saved==='dark') document.documentElement.setAttribute('data-theme',saved);
  } catch(e) {}
})();
</script>
<style>
:root{
  --bg:#f1f4f3;--surface:#ffffff;--ink:#13272b;--muted:#5b7075;--line:#dde5e4;
  --brand:#0c6a64;--brand-ink:#ffffff;--soft:#e4f0ee;--accent:#d8942a;--bad:#b23f2d;--good:#26784a;--warn-bg:#fbf0dc;
  --shadow:0 1px 2px rgba(19,39,43,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1a1d;--surface:#15252a;--ink:#e7f0ef;--muted:#92a9ac;--line:#25393e;--brand:#3db3a8;--brand-ink:#07211f;--soft:#1a3034;--accent:#e3a53f;--bad:#e5806e;--good:#5cc18a;--warn-bg:#33291a;--shadow:none}
}
:root[data-theme="dark"]{--bg:#0e1a1d;--surface:#15252a;--ink:#e7f0ef;--muted:#92a9ac;--line:#25393e;--brand:#3db3a8;--brand-ink:#07211f;--soft:#1a3034;--accent:#e3a53f;--bad:#e5806e;--good:#5cc18a;--warn-bg:#33291a;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:720px;margin:auto}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.theme-toggle{flex:none;color:var(--ink);transition:background .18s ease,border-color .18s ease}
.theme-toggle:hover{background:var(--soft);border-color:var(--brand)}
.theme-toggle svg{width:20px;height:20px}
.theme-toggle .theme-sun{display:none}
:root[data-theme="light"] .theme-toggle .theme-moon{display:none}
:root[data-theme="light"] .theme-toggle .theme-sun{display:block}
@media(max-width:420px){.top{gap:6px;padding-inline:10px}.top h1{font-size:17px}.theme-toggle{width:34px;height:34px}}
main{max-width:720px;margin:auto;padding:4px 16px 150px}
.nav{position:fixed;bottom:0;inset-inline:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px;max-width:140px;margin:auto}
.nav svg,.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--brand);font-weight:600}
.nav button.on svg{stroke-width:2.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:16px;margin-bottom:12px}
.hero .lab{margin:10px 0 0;opacity:.85;font-size:13px}
.hero .big{font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-.5px}
.hero .sub{margin:2px 0 8px;opacity:.85;font-size:13px}
.hero svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:99px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero .chip{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.4)}
.hero .chip.on{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{font-size:18px;display:block;margin-top:2px}
.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted);display:block}
.row.tap{cursor:pointer;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;color:inherit}
.end{text-align:end;flex:none}
.badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:600}
.badge.bad{background:var(--warn-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:#a46a10}.badge.grey{background:var(--line);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1;min-width:110px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
input[type=number]{direction:ltr;text-align:right}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{margin:4px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tile b{font-size:14px;line-height:1.35}
.tile .pr{color:var(--brand);font-weight:700;margin-top:auto}
.tile small{color:var(--muted)}
.tile.out{opacity:.5}
.cartbar{position:fixed;left:0;right:0;margin-inline:auto;width:calc(100% - 24px);max-width:696px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:22;border:0;background:var(--accent);color:#1b1304;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--brand);color:var(--brand-ink);border:0;border-radius:16px;padding:13px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:10px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-weight:600;text-align:start}
.menu .ic{color:var(--brand);width:26px;height:26px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.n,th.n{text-align:end}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.stepper span{min-width:24px;text-align:center;font-weight:600}
#modal{position:fixed;inset:0;z-index:110;display:flex;align-items:flex-end;justify-content:center}
#modal .scrim{position:absolute;inset:0;background:rgba(5,15,17,.55)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:600px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sh-head h2{margin:0;font-size:17px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%}
.sh-body{overflow-y:auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:120;font-size:14px;max-width:90%}
.inv{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:16px}
.inv h3{margin:0 0 2px;font-size:18px}
.inv small{color:#555}
.inv table{font-size:13px}
.inv th{color:#555}.inv th,.inv td{border-color:#ddd}
.inv .tot{display:flex;justify-content:space-between;padding:3px 0}
.inv .tot.g{font-weight:700;font-size:16px;border-top:2px solid #111;margin-top:6px;padding-top:8px}
.note{background:var(--warn-bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px}
textarea{min-height:160px;direction:ltr;font-family:ui-monospace,monospace;font-size:12px}
@media print{
  .top,.nav,.cartbar,.fab,.no-print,.toast{display:none!important}
  body.hasmodal #app,body.hasmodal #pos{display:none!important}
  body.hasmodal #modal{position:static}
  #modal .scrim,.sh-head{display:none!important}
  .sheet{position:static;max-height:none;width:100%;max-width:none;background:#fff}
  .sh-body{overflow:visible}
  body{background:#fff}
  .card{box-shadow:none}
}

#pos{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:auto;font-size:13px;padding-top:env(safe-area-inset-top,0px)}
#pos button{color:var(--btxt)}
#pos .ph{background:linear-gradient(var(--hd1),var(--hd2));border-bottom:2px solid var(--hdb);color:var(--ph);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex:none}
#pos .ph-t{font-size:22px;font-weight:700;color:var(--ttl);text-align:center;flex:1}
#pos .ph-r,#pos .ph-l{min-width:130px;font-weight:600}
#pos .ph-l{text-align:end}
#pos .ph-l a{color:var(--ttl)}
#pos .invno{color:var(--inv);font-size:18px;font-weight:700;margin-inline-start:6px}
#pos .pinfo{background:linear-gradient(var(--info1),var(--info2));border-bottom:1px solid var(--pnb);padding:4px 14px;display:flex;flex:none}
#pos .logo{margin-inline-start:auto;font-weight:800;letter-spacing:3px;color:var(--logo);font-size:22px;direction:ltr;text-transform:uppercase}
#pos .pbody{display:flex;gap:8px;padding:8px;flex:1 0 auto}
#pos .pright{width:252px;flex:none;display:flex;flex-direction:column;gap:6px}
#pos .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#pos .b3{display:flex;flex-direction:column;gap:4px;margin-top:auto}
#pos .pb{border:1px solid var(--kb);border-radius:8px;padding:10px 4px;font-size:12px;font-weight:700;min-height:50px;line-height:1.3;cursor:pointer}
#pos .pb:active,#pos .k:active,#pos .ib:active{filter:brightness(.9)}
#pos .red{background:linear-gradient(var(--r1),var(--r2))}
#pos .green{background:linear-gradient(var(--g1),var(--g2))}
#pos .cyan{background:linear-gradient(var(--c1),var(--c2))}
#pos .orange{background:linear-gradient(var(--o1),var(--o2))}
#pos .yellow{background:linear-gradient(var(--y1),var(--y2))}
#pos .grey{background:linear-gradient(var(--n1),var(--n2));color:var(--kt)}
#pos .white{background:linear-gradient(var(--w1),var(--w2));color:var(--kt)}
#pos .pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#pos .ptable{flex:1;min-height:180px;overflow:auto;border:1px solid var(--thb);border-radius:8px;background:var(--tdbg)}
#pos .ptable table{width:100%;border-collapse:collapse}
#pos .ptable th{background:var(--th);color:var(--ink);font-weight:600;text-align:center;padding:9px 4px;border:1px solid var(--thb);position:sticky;top:0;z-index:1}
#pos .ptable td{text-align:center;padding:4px;border:1px solid var(--tdb);white-space:nowrap;color:var(--ink)}
#pos .ptable td.nm{text-align:start;white-space:normal;min-width:150px}
#pos .ptable tr.sel td{background:var(--sel)}
#pos .ptable td input{width:72px;text-align:center;border:1px solid transparent;background:transparent;padding:3px;border-radius:3px;direction:ltr;color:var(--ink)}
#pos .ptable td input:focus{border-color:var(--entb);background:var(--entf)}
#pos .ptable tr.entry td{background:var(--ent)}
#pos .ptable tr.entry td.nm input{width:100%;text-align:start;direction:rtl;border:2px solid var(--entb);background:var(--entf);padding:7px 8px;border-radius:6px}
#pos .sugs{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
#pos .sg{border:1px solid var(--sgbd);background:var(--sgb);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:600}
#pos .sg small{color:var(--price);margin-inline-start:4px}
#pos .pbot{display:flex;gap:10px;align-items:stretch;flex:none}
#pos .pcust{flex:1;min-width:150px;background:linear-gradient(var(--pn1),var(--pn2));border:1px solid var(--pnb);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:240px;color:var(--ink)}
#pos .pcust .msg{color:var(--msg);font-weight:700}
#pos .pcust .place{margin-top:auto;color:var(--place);font-size:12px;font-weight:700}
#pos .pad{display:grid;direction:ltr;grid-template-columns:repeat(5,66px);grid-template-rows:repeat(4,58px);gap:4px;flex:none;grid-template-areas:"k7 k8 k9 kc kn" "k4 k5 k6 kca ka" "k1 k2 k3 ke kt" "k0 k00 kd ke kt"}
#pos .k{border:1px solid var(--kb);border-radius:8px;background:linear-gradient(var(--k1),var(--k2));color:var(--kt);font-weight:700;font-size:15px;cursor:pointer;direction:rtl;padding:0}
#pos .k.red{background:linear-gradient(var(--r1),var(--r2));color:var(--btxt)}
#pos .k.pur{background:linear-gradient(var(--p1),var(--p2));color:var(--btxt);font-size:13px}
#pos .k.ent{background:linear-gradient(var(--e1),var(--e2));color:var(--btxt)}
#pos .k.tot{background:linear-gradient(var(--t1),var(--t2));color:var(--btxt);font-size:12px;line-height:1.3}
#pos .stats{width:330px;flex:none;display:flex;flex-direction:column}
#pos .st{display:flex;justify-content:space-between;padding:5px 8px;border:1px solid var(--stb);background:var(--st);font-size:12.5px;color:var(--ink)}
#pos .st:first-child{border-radius:8px 8px 0 0}
#pos .st b{font-weight:600}
#pos .big{border:1px solid var(--stb);background:var(--big);flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:0 0 8px 8px;margin-top:-1px}
#pos .big div{font-size:44px;font-weight:700;direction:ltr;line-height:1.1;color:var(--bigt)}
#pos .big small{color:var(--muted2)}
#pos .pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 14px;background:var(--bar);border-top:1px solid var(--barb);flex:none}
#pos .tw b{color:var(--lbl);margin-inline-end:8px}
#pos .tw span{color:var(--words);font-weight:700}
#pos .ibtns{display:flex;gap:4px}
#pos .ib{height:38px;min-width:46px;border:1px solid var(--kb);border-radius:8px;background:linear-gradient(var(--k1),var(--k2));color:var(--kt);font-weight:700;padding:0 10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#pos .ib.rd{background:linear-gradient(var(--r1),var(--r2));color:var(--btxt)}
#pos .pst{background:var(--bg);border-top:1px solid var(--barb);padding:3px 14px;color:var(--clk);font-weight:700;font-size:12px;display:flex;justify-content:space-between;flex:none;direction:ltr}
#plock{position:fixed;inset:0;z-index:70;background:#0b1f33;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;font-weight:600}
.themes button.on{border-color:var(--brand)}
.themes i{display:flex;height:26px;border-radius:8px;overflow:hidden}
.themes i b{flex:1}
@media(max-width:860px){
  #pos .pbody{flex-direction:column}
  #pos .pright{width:auto}
  #pos .bgrid{grid-template-columns:repeat(5,1fr)}
  #pos .pb{min-height:46px;padding:6px 2px;font-size:11px}
  #pos .b3{flex-direction:row;margin-top:0}
  #pos .b3 .pb{flex:1}
  #pos .pbot{flex-direction:column-reverse}
  #pos .pad{grid-template-columns:repeat(5,1fr);width:100%}
  #pos .stats{width:auto}
  #pos .pcust{min-height:0}
  #pos .ph-r,#pos .ph-l{min-width:0;font-size:12px}
  #pos .ph-t{font-size:18px}
  #pos .big{min-height:90px}
  #pos .big div{font-size:36px}
}
/* ===== ترتيب شبكة المواد ===== */
#pos .pb.pur{background:linear-gradient(var(--p1),var(--p2))}
#pos .pb.tot{background:linear-gradient(var(--t1),var(--t2))}
#pos .pb.ent{background:linear-gradient(var(--e1),var(--e2))}
#pos .gbody{display:flex;gap:10px;padding:10px;flex:1 0 auto;min-height:0}
#pos .gprod{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#pos .gsearch{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--entb);background:var(--entf);color:var(--ink);font-size:15px}
#pos .gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#pos .gchips::-webkit-scrollbar{display:none}
#pos .gchip{flex:none;border:1px solid var(--kb);border-radius:99px;padding:6px 14px;background:linear-gradient(var(--k1),var(--k2));color:var(--kt);font-weight:600}
#pos .gchip.on{background:var(--hd2);color:var(--ttl);border-color:var(--hd2)}
#pos .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;align-content:start;overflow:auto;flex:1;min-height:200px}
#pos .pt{position:relative;background:linear-gradient(var(--k1),var(--k2));border:1px solid var(--kb);border-radius:12px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:3px;min-height:94px;color:var(--kt)}
#pos .pt b{font-size:13.5px;line-height:1.35;padding-inline-end:20px}
#pos .pt-p{color:var(--price);font-weight:700;margin-top:auto}
#pos .pt small{color:var(--muted2)}
#pos .pt.out{opacity:.45}
#pos .pt:active{filter:brightness(.92)}
#pos .pt-b{position:absolute;top:6px;inset-inline-end:6px;background:var(--hd2);color:var(--ttl);border-radius:99px;min-width:22px;height:22px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#pos .ginv{width:360px;flex:none;display:flex;flex-direction:column;gap:8px;background:linear-gradient(var(--pn1),var(--pn2));border:1px solid var(--pnb);border-radius:14px;padding:10px;color:var(--ink)}
#pos .gi-head{display:flex;gap:6px}
#pos .gi-cust,#pos .gi-sm{border:1px solid var(--kb);border-radius:10px;background:linear-gradient(var(--k1),var(--k2));color:var(--msg);font-weight:700;padding:9px 10px;text-align:start}
#pos .gi-cust{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pos .gi-lines{flex:1;min-height:140px;max-height:44vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
#pos .gl{display:flex;align-items:center;gap:8px;background:var(--tdbg);border:1px solid var(--tdb);border-radius:10px;padding:8px}
#pos .gl.sel{border-color:var(--entb);background:var(--sel)}
#pos .gl-n{flex:1;min-width:0}
#pos .gl-n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13.5px}
#pos .gl-n small{color:var(--muted2)}
#pos .gl .stepper button{background:linear-gradient(var(--k1),var(--k2));color:var(--kt);border:1px solid var(--kb)}
#pos .gl .stepper span{color:var(--ink)}
#pos .gl-t{min-width:62px;text-align:end;color:var(--ink);font-size:13.5px}
#pos .gl-x{border:0;background:transparent;color:var(--muted2);font-size:16px;padding:4px}
#pos .gl-empty{color:var(--muted2);text-align:center;padding:26px 8px}
#pos .gi-tot .st{border-radius:0}
#pos .gi-tot .st:first-child{border-radius:8px 8px 0 0}
#pos .gi-big{display:flex;justify-content:space-between;align-items:center;background:var(--big);border:1px solid var(--stb);border-radius:0 0 10px 10px;padding:8px 12px;margin-top:-1px}
#pos .gi-big span{color:var(--muted2)}
#pos .gi-big b{font-size:32px;direction:ltr;color:var(--bigt);line-height:1.15}
#pos .gi-tax{display:block;text-align:center;color:var(--muted2);min-height:0}
#pos .gi-act{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px}
#pos .gi-act2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#pos .gi-act2 .pb{min-height:40px;font-size:11px;padding:4px 2px}
.themes button{text-align:start}
@media(max-width:860px){
  #pos .gbody{flex-direction:column}
  #pos .ginv{width:auto}
  #pos .pgrid{max-height:38vh;min-height:150px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  #pos .gi-lines{max-height:none}
}
/* ===== الدخول والصلاحيات ===== */
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin:auto}
.auth-card h1{margin:0 0 6px;font-size:22px;color:var(--brand)}
.pchk{display:flex;align-items:center;gap:10px;margin:0;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.pchk:last-child{border-bottom:0}
.pchk input{width:auto}
/* ===== واجهة المدير (نمط سطح المكتب المحاسبي) ===== */
body.deskhome main,body.deskhome .top{max-width:1180px}
.dsk{--pr:#c0182b;--dk1:#5d5f66;--dk2:#43454b;--sq:color-mix(in srgb,var(--muted) 16%,var(--surface))}
.dbar{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 4px;margin-bottom:12px;scrollbar-width:none}
.dbar::-webkit-scrollbar{display:none}
.dbar button{flex:none;min-width:78px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;padding:4px 6px;color:var(--ink);border-radius:6px}
.dbar button:active{background:var(--soft)}
.dbar .ic{width:30px;height:30px;stroke-width:1.6}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.dlogo{font-weight:800;font-size:26px;letter-spacing:2px;color:var(--pr);line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dlogo small{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:600}
.dsq{display:flex;gap:8px;flex:none}
.dsq button{width:44px;height:44px;border:0;border-radius:3px;background:var(--sq);color:var(--muted);display:flex;align-items:center;justify-content:center}
.dsq .ic{width:22px;height:22px}
.desk{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.desk{grid-template-columns:1fr 250px;align-items:start}}
.dmain{min-width:0}
.dside{display:flex;flex-direction:column;gap:6px}
@media(max-width:859px){.dside{display:grid;grid-template-columns:1fr 1fr}.dside h4{grid-column:1/-1}}
.dside h4{margin:8px 0 2px;font-size:12.5px;color:var(--muted);font-weight:500}
.dk{border:0;background:linear-gradient(var(--dk1),var(--dk2));color:#fff;font-weight:700;font-size:14px;padding:11px 8px;border-radius:3px;text-align:center}
.dk:active{filter:brightness(1.25)}
.dk.lt{background:var(--surface);color:var(--muted);border:1px solid var(--line);font-weight:500}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.dtabs button{flex:1;border:0;border-top:3px solid var(--pr);background:var(--bg);padding:10px 4px;color:var(--muted);font-size:13.5px}
.dtabs button.on{border-top-color:#1e78d0;color:var(--ink);font-weight:700;background:var(--surface)}
.dp{background:var(--surface);border:1px solid var(--line);margin:12px 0}
.dp-h{background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:space-between;min-height:42px}
.dp-t{padding:0 14px;font-weight:700;font-size:14.5px}
.dp-i{display:flex;direction:ltr}
.dp-i button{width:42px;height:42px;border:0;background:none;border-inline-start:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center}
.dp-i .ic{width:16px;height:16px;stroke-width:2.4}
.dp-b{padding:14px;display:flex;flex-wrap:wrap;gap:12px}
.dp-b.list{display:block;padding:4px 14px}
.dp-b[hidden]{display:none}
.dt{display:flex;flex:1 1 220px;max-width:340px;min-height:84px;color:#fff;border-radius:2px;overflow:hidden}
.dt-s{width:38px;border:0;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.dt-s .ic{width:17px;height:17px;stroke-width:2.6}
.dt-b{flex:1;padding:10px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;min-width:0}
.dt-b b{font-size:25px;line-height:1.25;font-weight:600;unicode-bidi:plaintext}
.dt-b span{font-size:14px;opacity:.95}
.dt.g{background:#3fae3a}.dt.b{background:#2a7fd0}.dt.o{background:#e08a1e}.dt.r{background:#c0182b}.dt.p{background:#7a4bb0}.dt.t{background:#0c8f87}
.dfoot{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
/* ===== فاتورة المشتريات (نافذة بنمط Phenix) ===== */
#pinv{--pb:#050f0b;--ps:#0b1e15;--ps2:#08170f;--pl:#14452b;--pl2:#1d6b40;--pg:#27e060;--px:#e8f5ee;--pm:#8fb3a1;--pa:#f5c518;--pr:#ff6b5b;position:fixed;inset:0;z-index:40;background:rgba(2,8,5,.78);display:flex;align-items:center;justify-content:center;padding:14px}
#pinv.full{padding:0}
#pinv .pw{background:var(--pb);color:var(--px);width:100%;max-width:1200px;height:100%;max-height:800px;display:flex;flex-direction:column;border:1px solid var(--pl);border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:13px;direction:rtl;color-scheme:dark}
#pinv.full .pw{max-width:none;max-height:none;border:0;border-radius:0}
#pinv .pw *{box-sizing:border-box}
#pinv .pw-t{display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(90deg,#07130d,#0a2016);border-bottom:1px solid var(--pl);color:var(--px);font-size:15px;font-weight:600}
#pinv .pw-t .lg{width:24px;height:24px}
#pinv .pw-t .wb{margin-inline-start:auto;display:flex;direction:ltr;gap:2px}
#pinv .pw-t .wb button{width:40px;height:26px;border:0;background:none;color:var(--pm);font-size:15px;border-radius:5px}
#pinv .pw-t .wb button:hover{background:var(--ps)}
#pinv .pw-t .wb button.x:hover{background:var(--pr);color:#fff}
#pinv .pw-b{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#pinv .pw-top{display:grid;grid-template-columns:minmax(210px,.9fr) minmax(260px,1.5fr) minmax(220px,1fr);grid-template-areas:"a b c" "a n n";gap:8px 12px}
#pinv .ga{grid-area:a}#pinv .gb2{grid-area:b}#pinv .gc{grid-area:c}#pinv .gn{grid-area:n}
#pinv .gbx{border:1px solid var(--pl);background:linear-gradient(160deg,#0b1e15,#07140e);padding:6px 10px;border-radius:10px}
#pinv .fr{display:flex;align-items:center;gap:6px;margin:5px 0}
#pinv .fr>label{margin:0;width:84px;flex:none;color:var(--pm);font-size:13px}
#pinv .fr>.fx{flex:1;min-width:0;display:flex;gap:4px;align-items:center}
#pinv .pw input,#pinv .pw select{width:100%;height:28px;padding:2px 8px;border:1px solid var(--pl);border-radius:6px;background:var(--ps2);color:var(--px);font:inherit;min-width:0}
#pinv .pw input[readonly],#pinv .pw select.gy{background:#0d2417;color:#cfe3d8}
#pinv .pw select option{background:#0b1e15;color:var(--px)}
#pinv .pw input:focus,#pinv .pw select:focus{outline:2px solid var(--pg);outline-offset:-1px}
#pinv .mg{flex:none;width:30px;height:28px;border:1px solid var(--pl);background:var(--ps2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--pg);padding:0}
#pinv .mg .ic{width:15px;height:15px;stroke-width:2.2}
#pinv .r1{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
#pinv .r1 .ty{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--pm)}
#pinv .r1 .ty b{color:var(--pg);font-size:15px}
#pinv .nv{display:flex;direction:ltr;gap:3px;align-items:center}
#pinv .nv button{width:34px;height:28px;border:1px solid var(--pl);background:var(--ps);border-radius:6px;color:var(--pg);font-weight:700;font-size:15px;line-height:1;padding:0}
#pinv .nv button:hover{background:var(--pl)}
#pinv .nv input{width:128px;text-align:center;direction:ltr;font-size:14px;font-weight:700}
#pinv .sec{display:flex;align-items:center;gap:8px;margin-top:6px}
#pinv .sec .fx{flex:1}
#pinv .sec select{width:150px}
#pinv .lvl{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pg);box-shadow:0 0 8px var(--pg);margin-inline:2px}
#pinv .tabs{display:flex;gap:2px;margin-top:2px;padding-inline-start:6px}
#pinv .tabs button{border:1px solid var(--pl);border-bottom:0;background:var(--ps2);color:var(--pm);padding:6px 16px;border-radius:8px 8px 0 0;font:inherit;font-size:13px}
#pinv .tabs button.on{background:var(--ps);color:var(--pg);font-weight:700;border-color:var(--pl2)}
#pinv .tb{display:flex;align-items:center;gap:6px;background:var(--ps);border:1px solid var(--pl);border-radius:10px;padding:4px 6px}
#pinv .tb .ib2{width:30px;height:28px;border:0;background:none;color:var(--pg);display:flex;align-items:center;justify-content:center;border-radius:6px;padding:0}
#pinv .tb .ib2:hover{background:var(--pl)}
#pinv .tb .ib2 .ic{width:19px;height:19px;stroke-width:2}
#pinv .tb .qs{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--pl);border-radius:8px;padding:0 8px;height:30px;background:var(--ps2)}
#pinv .tb .qs input{border:0!important;height:26px;text-align:center;background:transparent!important;outline:none!important}
#pinv .tb .qs input::placeholder{color:var(--pm)}
#pinv .tb .qs .ic{width:20px;height:20px;color:var(--pg);stroke-width:2.2;flex:none}
#pinv .pgrid{background:var(--ps2);border:1px solid var(--pl);border-radius:10px;overflow:auto;height:clamp(170px,calc(100vh - 560px),460px);flex:none}
#pinv table{border-collapse:collapse;width:100%;min-width:1060px}
#pinv th{background:#0a1912;color:var(--pm);font-weight:600;font-size:13px;padding:7px 6px;text-align:center;border:1px solid var(--pl);position:sticky;top:0;z-index:1}
#pinv td{border:1px solid #0f3220;padding:0;height:29px}
#pinv tbody tr:nth-child(even) td{background:#07150e}
#pinv tbody tr.sel td{background:#0f2a1d}
#pinv td input{border:0!important;border-radius:0!important;background:transparent!important;height:28px;padding:2px 6px;text-align:center;color:var(--px)}
#pinv td input.nm{text-align:start}
#pinv td input:focus{outline:2px solid var(--pg)!important;outline-offset:-2px;background:#0b1e15!important}
#pinv td.pn{text-align:center;color:var(--pg);font-weight:700;width:38px;background:#0a1912!important}
#pinv td.pt{text-align:center;font-weight:700;direction:ltr;padding:0 6px;color:var(--px)}
#pinv th.sp{color:var(--pg);background:#0d2417}
#pinv td.sp input{color:var(--pg);font-weight:700}
#pinv .pw input:disabled,#pinv .pw select:disabled{opacity:1;-webkit-text-fill-color:var(--px);cursor:default}
#pinv .words b{margin-inline-start:6px}#pinv .words{justify-content:space-between;gap:24px}
#pinv .pdel{border:0;background:none;color:var(--pr);width:100%;height:28px;padding:0}
#pinv input[type=number]{-moz-appearance:textfield;direction:ltr}
#pinv input[type=number]::-webkit-outer-spin-button,#pinv input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#pinv .gnav{display:flex;align-items:center;gap:4px;direction:ltr;justify-content:flex-start;color:var(--pg);font-size:12.5px}
#pinv .gnav button{border:0;background:none;color:var(--pg);width:24px;height:22px;font-size:13px;padding:0}
#pinv .gnav span{color:var(--pm);direction:rtl;margin-inline:4px}
#pinv .pfw{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--pl);border-radius:10px;background:linear-gradient(160deg,#0b1e15,#07140e);padding:8px 10px}
#pinv .pf{display:grid;grid-template-columns:repeat(3,minmax(190px,230px));gap:5px 14px}
#pinv .pf .c{display:flex;align-items:center;gap:6px}
#pinv .pf .c>label{width:82px;flex:none;margin:0;font-size:13px;color:var(--pm)}
#pinv .pf .bx{flex:1;height:28px;border:1px solid var(--pl);background:#0d2417;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-weight:700;direction:ltr;min-width:0;overflow:hidden;color:var(--px)}
#pinv .pf input{text-align:end;direction:ltr;font-weight:700}
#pinv .pf .st{flex:1;height:28px;border:0;border-radius:6px;background:linear-gradient(160deg,#1fd35a,#0f8f3a);color:#03130a;font-weight:700;font-size:14px}
#pinv .pf .st.no{background:linear-gradient(160deg,#f5c518,#c9960a);color:#1a1300}
#pinv .mk{color:var(--pm);font-size:12.5px;padding-top:4px;direction:rtl}
#pinv .words{display:flex;align-items:center;gap:12px;margin-top:2px;font-weight:700;font-size:15px;color:var(--pg)}
#pinv .words i{flex:1;max-width:440px;border-top:1px solid var(--pl2)}
#pinv .pan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;background:var(--ps);border:1px solid var(--pl);border-radius:10px;padding:12px;min-height:190px;align-content:start}
#pinv .pan label{color:var(--pm);font-size:13px;margin:8px 0 4px}
#pinv .pw-bb{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--pl);background:linear-gradient(#08150e,#050e09);overflow-x:auto}
#pinv .pw-bb button{flex:none;min-width:84px;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--pl);background:var(--ps);border-radius:8px;color:var(--px);font:inherit;font-size:13px;padding:0 12px}
#pinv .pw-bb button:hover:not(:disabled){background:var(--pl);border-color:var(--pg)}
#pinv .pw-bb button:disabled{opacity:.35}
#pinv .pw-bb .ic{width:18px;height:18px;stroke-width:2}
#pinv .pw-bb .rd{color:var(--pr);font-weight:700}
#pinv .pw-bb .gr{color:var(--pg)}
#pinv .pw-bb .gap{flex:1}
@media(max-width:899px){
 #pinv{padding:0}#pinv .pw{max-width:none;max-height:none;border:0}
 #pinv .pw-top{grid-template-columns:1fr;grid-template-areas:"a" "b" "c" "n"}
 #pinv .pf{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){#pinv .pf{grid-template-columns:1fr}}
@media print{
 body.haspinv>*:not(#pinv){display:none!important}
 #pinv{position:static;background:none;padding:0;display:block}
 #pinv .pw{max-height:none;height:auto;box-shadow:none;border:0}
 #pinv{--pb:#fff;--ps:#fff;--ps2:#fff;--pl:#999;--pg:#000;--px:#000;--pm:#333}
 #pinv .pw-bb,#pinv .pw-t .wb,#pinv .tb,#pinv .gnav{display:none!important}
 #pinv .pw-b{overflow:visible}#pinv .pgrid{overflow:visible}
}

/* ===== لوحة ORVEX الرئيسية ===== */
.odash{--bg:#050f0b;--ln:#14452b;--g:#27e060;--tx:#e8f5ee;--mu:#8fb3a1;--amb:#f5c518;--rd:#ff6b5b;
  min-height:100vh;background:radial-gradient(1100px 520px at 85% -8%,#0d3d24 0,transparent 62%),var(--bg);color:var(--tx);
  display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"h h" "s m" "f f"}
.odash button{color:inherit}
.odash svg.ic{stroke:currentColor}
.od-h{grid-area:h;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--ln);background:linear-gradient(90deg,#07130d,#0a2016);position:relative}
.od-h::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);opacity:.55}
.od-brand{display:flex;align-items:center;gap:12px;direction:ltr;flex:none}
.od-brand .lg{width:62px;height:62px;flex:none}
.od-brand .tx{display:flex;flex-direction:column;align-items:center}
.ow{font-weight:800;letter-spacing:5px;line-height:1;background:linear-gradient(180deg,#fff,#9fb3aa);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;display:inline-block}
.ow i{font-style:normal;background:linear-gradient(180deg,#6dff95,#12b04a);-webkit-background-clip:text;background-clip:text;color:transparent}
.od-brand .ow{font-size:38px}
.od-brand small,.od-sb small{display:flex;align-items:center;gap:8px;color:#cfe3d8;font-size:14px;margin-top:6px;direction:rtl}
.od-brand small::before,.od-brand small::after{content:"";width:22px;height:1px;background:var(--g);opacity:.7}
.od-search{flex:1;max-width:430px;position:relative;margin-inline:auto}
.od-search svg{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu)}
.odash input.sr{width:100%;padding:10px 40px 10px 14px;border-radius:99px;background:#07150f;border:1px solid var(--ln);color:var(--tx)}
.odash input.sr::placeholder{color:var(--mu)}
.od-bell{position:relative;width:40px;height:40px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#cfe3d8}
.od-bell .ic{width:24px;height:24px}
.od-bell i{position:absolute;top:6px;inset-inline-end:7px;width:9px;height:9px;border-radius:50%;background:var(--amb);box-shadow:0 0 8px var(--amb)}
.od-user{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:start;padding:0 6px;border-inline:1px solid var(--ln)}
.od-user .av{width:42px;height:42px;color:#cfe3d8}
.od-user .av .ic{width:42px;height:42px;stroke-width:1.4}
.od-user b{display:block;font-size:15px;line-height:1.3}
.od-user span{display:block;color:var(--mu);font-size:12.5px}
.od-user .ic.cv{width:16px;height:16px;color:var(--mu)}
.od-clock{display:flex;flex-direction:column;align-items:flex-end;color:var(--g);flex:none}
.od-clock b{font-size:28px;line-height:1.1;font-weight:600;direction:ltr;letter-spacing:1px}
.od-clock span{color:#cfe3d8;font-size:13px;direction:ltr}
.od-side{grid-area:s;display:flex;flex-direction:column;gap:3px;padding:14px 12px;background:linear-gradient(#08150e,#050e09);border-inline-end:1px solid var(--ln);min-width:0}
.od-mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:none;color:#cfe3d8;border-radius:10px;font-size:15px;text-align:start}
.od-mi .ic{width:22px;height:22px;flex:none;stroke-width:1.6}
.od-mi:hover{background:#0d2218}
.od-mi.on{background:linear-gradient(90deg,#1ed25a,#12a443);color:#03130a;font-weight:700;box-shadow:0 0 18px rgba(39,224,96,.3)}
.od-mi.sm{font-size:13px;color:var(--mu);padding:7px 14px}
.od-side h4{margin:10px 6px 2px;font-size:12px;color:var(--mu);font-weight:500}
.od-sb{margin-top:auto;display:flex;flex-direction:column;align-items:center;padding-top:22px;direction:ltr}
.od-sb .lg{width:74px;height:74px}
.od-sb .ow{font-size:26px;margin-top:6px}
.od-sb small{font-size:12px;margin-top:4px}
.od-main{grid-area:m;padding:16px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-content:start;min-width:0}
.od-c{background:linear-gradient(160deg,#0b1e15,#07140e);border:1px solid var(--ln);border-radius:14px;padding:14px;min-width:0}
.od-c h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.od-c h3 .ic{width:22px;height:22px;color:var(--g)}
.od-k{grid-column:span 3;display:flex;justify-content:space-between;gap:10px;cursor:pointer;text-align:start;color:inherit;font:inherit;width:100%}
.od-k .kr{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.od-k .kr b{font-size:28px;line-height:1.15;font-weight:600;overflow-wrap:anywhere}
.od-k .kr span{color:#cfe3d8;font-size:14.5px;margin-top:2px}
.od-k .kr .mi{margin-top:8px;color:var(--g);opacity:.7}
.od-k .kr .mi .ic{width:22px;height:22px}
.od-k .kl{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.od-k .kl .big .ic{width:40px;height:40px;color:var(--g);stroke-width:1.6}
.tr{font-size:14px;font-style:normal;color:var(--g);direction:ltr;white-space:nowrap}
.tr.dn{color:var(--rd)}.tr.fl{color:var(--mu)}
.od-chart{grid-column:span 8}
.od-chart svg{width:100%;height:auto;display:block;direction:ltr}
.od-don{grid-column:span 4;display:flex;flex-direction:column;align-items:center}
.od-don h3{align-self:stretch}
.od-don .ring{position:relative;width:190px;max-width:100%;margin:6px auto}
.od-don .ring svg{width:100%;display:block}
.od-don .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.od-don .mid b{font-size:24px;font-weight:600;direction:ltr}
.od-don .mid span{color:#cfe3d8;font-size:14px}
.od-don .cmp{color:var(--mu);font-size:12.5px;text-align:center}
.od-recent{grid-column:span 8;overflow:hidden}
.od-qa{grid-column:span 4}
.od-tw{overflow-x:auto}
.od-t{width:100%;border-collapse:collapse;min-width:560px;font-size:13.5px}
.od-t th{color:var(--mu);font-weight:500;text-align:start;padding:8px 6px;background:#0a1912}
.od-t td{padding:9px 6px;border-top:1px solid #12301f;white-space:nowrap}
.od-t tr.cl{cursor:pointer}.od-t tr.cl:hover td{background:#0c2218}
.pl{display:inline-block;padding:2px 14px;border-radius:99px;font-size:12px;font-weight:700;background:#17b04b;color:#03130a}
.pl.w{background:var(--amb);color:#3a2b00}.pl.o{background:#e8873a;color:#2a1200}.pl.g{background:#3a4a42;color:#cfe3d8}
.od-qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.od-q{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--ln);border-radius:12px;background:#08170f;color:#dff3e7;font-size:14.5px}
.od-q .ic{width:34px;height:34px;color:var(--g);stroke-width:1.5}
.od-q.wide{grid-column:1/-1}
.od-q.pr{background:linear-gradient(160deg,#1fd35a,#0f8f3a);color:#03130a;border-color:#2cf06a;font-weight:700}
.od-q.pr .ic{color:#03130a}
.od-mini{grid-column:span 3;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:inherit;font:inherit;text-align:start;width:100%}
.od-mini span{color:var(--mu);font-size:13px}.od-mini b{font-size:18px}
.od-f{grid-area:f;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--ln);font-size:13.5px;color:#cfe3d8;background:#050e09}
.od-f .st{display:flex;align-items:center;gap:8px}
.od-f .st::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g)}
@media(max-width:1100px){.od-k,.od-mini{grid-column:span 6}.od-chart,.od-don,.od-recent,.od-qa{grid-column:span 12}}
@media(max-width:899px){
 .odash{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;grid-template-areas:"h" "s" "m" "f"}
 .od-h{flex-wrap:wrap;gap:10px;padding:10px 12px}
 .od-brand .lg{width:44px;height:44px}.od-brand .ow{font-size:26px}.od-brand small{display:none}
 .od-search{order:9;flex-basis:100%;max-width:none;margin:0}
 .od-user div.nm{display:none}.od-user{border:0}
 .od-clock b{font-size:20px}
 .od-side{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;border-inline-end:0;border-bottom:1px solid var(--ln);scrollbar-width:none}
 .od-side::-webkit-scrollbar{display:none}
 .od-mi{flex:none;width:auto;white-space:nowrap;padding:8px 12px;font-size:13.5px}
 .od-side h4,.od-sb{display:none}
 .od-main{padding:12px;gap:10px}
 .od-k .kr b{font-size:21px}.od-k .kl .big .ic{width:30px;height:30px}
}
@media(max-width:520px){.od-k .kr b{font-size:18px}.od-k .kr span{font-size:12.5px}.od-mini{grid-column:span 12}}

/* ===== ثيم ORVEX الأخضر الداكن لكامل البرنامج ===== */
:root:root:root{--bg:#050f0b;--surface:#0b1e15;--ink:#e8f5ee;--muted:#8fb3a1;--line:#14452b;--brand:#27e060;--brand-ink:#03130a;--soft:#0f2a1d;--accent:#f5c518;--bad:#ff6b5b;--good:#27e060;--warn-bg:#2f2a10;--shadow:none;color-scheme:dark}
body{background:radial-gradient(1000px 500px at 85% -8%,#0d3d24 0,transparent 60%) fixed,var(--bg)}
body.odapp .top,body.odapp .nav{display:none}
body.odapp main{max-width:none;padding:0}
body.odapp .fab{bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 0 22px rgba(39,224,96,.4)}
.card,.kpi,.tile{background:linear-gradient(160deg,#0b1e15,#07140e);border-color:var(--line)}
.hero{background:linear-gradient(160deg,#1fd35a,#0f8f3a);color:#03130a;box-shadow:0 0 26px rgba(39,224,96,.25)}
.hero .chip{color:#03130a;border-color:rgba(3,19,10,.45)}.hero .chip.on{background:#03130a;color:#27e060;border-color:#03130a}
.btn{background:#0b1e15;border-color:var(--line)}
.btn.primary{background:linear-gradient(160deg,#27e060,#12a443);color:#03130a;border-color:#2cf06a;box-shadow:0 0 14px rgba(39,224,96,.25)}
.btn.danger{background:#c9382b;border-color:#e0584b}
input,select,textarea{background:#07150f;border-color:var(--line);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #27e060;outline-offset:0}
.scrim{background:rgba(0,6,3,.7)}
.sheet{border:1px solid var(--line)}
.badge{background:#0f2a1d;color:#27e060}
.chip.on{background:#27e060;color:#03130a;border-color:#27e060}
.toast{background:#27e060;color:#03130a;font-weight:600}
.od-page{grid-area:m;padding:16px 20px 90px;min-width:0;width:100%;max-width:1040px;margin:0 auto}
.od-pt{margin:0 0 14px;font-size:22px;display:flex;align-items:center;gap:10px}
.od-pt::before{content:"";width:5px;height:24px;border-radius:3px;background:linear-gradient(#6dff95,#12a443);box-shadow:0 0 12px rgba(39,224,96,.5)}
@media(min-width:900px){.od-side{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}}
@media(max-width:899px){.od-page{padding:12px 12px 90px}}
.auth-card{border-color:var(--line);box-shadow:0 0 50px rgba(39,224,96,.14)}
.auth-card h1{text-align:center;letter-spacing:7px;font-weight:800}
.auth-card>p.muted:first-of-type{text-align:center}
.auth-card .lg{width:76px;height:76px;display:block;margin:0 auto 6px}

<script>
(function(){
  var root=document.documentElement,button=document.getElementById('themeToggle');
  if(!button)return;
  function current(){return root.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
  function update(){
    var dark=current()==='dark';
    button.setAttribute('aria-pressed',dark?'true':'false');
    button.setAttribute('aria-label',dark?'التبديل إلى الوضع النهاري':'التبديل إلى الوضع الليلي');
    button.title=dark?'الوضع النهاري':'الوضع الليلي';
    var meta=document.getElementById('orvex-theme-color');
    if(meta)meta.setAttribute('content',dark?'#0e1a1d':'#0c6a64');
  }
  button.addEventListener('click',function(){
    var next=current()==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('orvex-theme',next);}catch(e){}
    update();
  });
  update();
})();
</script>
