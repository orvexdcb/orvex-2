name: ORVEX shop dashboard tests
on:
  push:
    branches: [main]
    paths:
      - 'shop-home.js'
      - 'tests/**'
      - 'package.json'
  pull_request:
    paths:
      - 'shop-home.js'
      - 'tests/**'
      - 'package.json'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
